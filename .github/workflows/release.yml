# Tag v* (or Run workflow) to compile DevCentr and attach Windows installer assets.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version stamp when not running from a tag (e.g. 0.1.1)
        required: false
        default: "0.0.0-ci"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Checkout DevCentr
        uses: actions/checkout@v4

      - name: Checkout msi-generator
        uses: actions/checkout@v4
        with:
          repository: dev-centr/msi-generator
          ref: v0.2.0
          path: msi-generator

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          package_json_file: app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install catalog dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build DevCentr
        working-directory: app
        run: dub build --build=release

      - name: Build msi-generator
        working-directory: msi-generator
        continue-on-error: true
        run: dub build --build=release --config=prod

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Package setup.exe, portable zip, MSI
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not $ver) { $ver = "0.0.0-ci" }
          $gen = "msi-generator/msi-generator.exe"
          if (-not (Test-Path $gen)) { $gen = "" }
          ./scripts/package-windows.ps1 -Version $ver -MsiGenerator $gen

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevCentr-windows-x64
          path: dist/upload/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/upload/*
          fail_on_unmatched_files: true
          body: |
            Windows x64:

            * **Installer (recommended):** `DevCentr-windows-x64-setup.exe`
            * **Portable:** `DevCentr-windows-x64.zip` (no installer)
            * **MSI:** `DevCentr-windows-x64.msi` when msi-generator succeeded (unsigned)

            Checksums are in `SHA256SUMS`.
